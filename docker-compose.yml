services:
  # ── Radio Nermeen (radio.hamdy.ca) ─────────────────────────────────────────
  # Served by the host-level cloudflared via ingress -> http://127.0.0.1:8090
  radio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio_nermeen_app
    restart: unless-stopped
    ports:
      # Published on host loopback so the host cloudflared can reach it.
      - "127.0.0.1:8090:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: radio_nermeen_network
